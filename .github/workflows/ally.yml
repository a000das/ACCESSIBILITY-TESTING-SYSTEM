name: Automated Accessibility Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ally-auditor

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ally-auditor/package-lock.json'

      # 3. Install project dependencies inside ally-auditor
      - name: Install Dependencies
        run: npm install
        
      # 4. Install a reliable static server globally
      - name: Install Static Server
        run: npm install -g http-server

      # 5. Start test server in background and wait for it to be ready
      - name: Start Local Web Server
        run: |
          npx http-server ./test-site -p 3000 &
          npx wait-on http://localhost:3000
    
      # 6. Run Accessibility Scanner
      - name: Run Accessibility Scan
        run: npm run scan

      # 7. Execute Report Checker
      - name: Check Accessibility Report
        run: npm run check-report

      # 8. Upload JSON Report Artifact
      - name: Upload Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: ally-auditor/reports/latest-scan.json