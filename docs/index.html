<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Acme Test Site - Home</title>
  <style>
    /* Fix color contrast for the paragraph */
    .low-contrast {
      color: #111111; /* Darker text for high contrast against background */
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <!-- Navigation Landmark -->
  <nav aria-label="Main Navigation">
    <a href="index.html">Home</a> | <a href="about.html">About</a>
  </nav>

  <main>
    <h1>Welcome to Acme</h1>
    
    <!-- Fixed Image Alt Text -->
    <img width="300" height="120" src="..." alt="Team photo collaborating in office">
    <img width="300" height="120" alt="Q3 sales up 40 percent chart" src="...">
    <img width="300" height="120" alt="Monthly sign-ups data graph" src="...">

    <h4>Our latest news</h4>

    <p class="low-contrast">Limited time offer: free shipping on all orders this week.</p>

    <!-- Fixed Form with Label & Accessible Button Name -->
    <form>
      <label for="email-input">Email Address</label>
      <input type="email" id="email-input" name="email">
      
      <button class="icon-btn" type="submit" aria-label="Submit Newsletter Form">
        <svg width="20" height="20" viewBox="0 0 20 20"><path d="M2 10l16-8-6 16-2-6z" fill="#000000"></path></svg>
      </button>
    </form>
  </main>
</body>
</html>
