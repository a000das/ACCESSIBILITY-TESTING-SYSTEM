name: Automated Accessibility Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Install 'serve' and 'wait-on' globally or locally to run the test site
      - name: Install Server Tools
        run: npm install -g serve wait-on

      # 5. Start the local test server in the background
      - name: Start Local Web Server
        run: |
          serve test-site -p 3000 &
          npx wait-on http://localhost:3000

      # 6. Run your accessibility scan
      - name: Run Accessibility Scan
        run: npm run scan

      # 7. Execute your check script to enforce quality gates
      - name: Check Accessibility Report
        run: npm run check-report

      # 8. Upload the generated JSON report as a downloadable workflow artifact
      - name: Upload Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: reports/latest-scan.json